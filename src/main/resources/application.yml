spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cinema_booking}
    username: ${DB_USERNAME:cinema_user}
    password: ${DB_PASSWORD:cinema_pass}

  jpa:
    # QUAN TRONG: Flyway la nguoi DUY NHAT duoc phep tao/sua schema.
    # Hibernate chi "validate" xem Entity co khop voi bang that trong DB khong.
    # Neu lech (thieu cot, sai kieu du lieu...) app se bao loi ngay khi start,
    # thay vi am tham sinh ra schema sai.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Chi dung cho local/dev. JWT_SECRET can >= 32 ky tu (HS256) - doi bang
# bien moi truong that khi len moi truong khac localhost.
jwt:
  secret: ${JWT_SECRET:dev-only-local-secret-change-me-in-prod-32bytes+}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Client ID cua app trong Google Cloud Console (OAuth 2.0 Client IDs,
# loai "Web application"). Dung chung cho ca FE (xin ID token) va BE
# (verify audience). Chua co gia tri that - phai tao OAuth Client that
# tren Google Cloud Console va set bien moi truong GOOGLE_CLIENT_ID de
# tinh nang "Login Google" hoat dong duoc voi token that.
google:
  client-id: ${GOOGLE_CLIENT_ID:}

# Origin cua frontend duoc phep goi API (CORS). Nhieu origin cach nhau
# boi dau phay (VD them domain production sau nay). Default khop port
# mac dinh cua Vite dev server.
app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
