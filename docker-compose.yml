services:
  postgres:
    image: postgres:16-alpine
    container_name: cinema-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cinema_booking}
      POSTGRES_USER: ${DB_USERNAME:-cinema_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cinema_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cinema_user} -d ${DB_NAME:-cinema_booking}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Chưa dùng ở Tuan 1, nhung setup san tu bay gio de Tuan 3 khong phai cau hinh lai.
  redis:
    image: redis:7-alpine
    container_name: cinema-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
